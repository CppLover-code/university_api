services:

  web:
    build: .

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8001:8000"

    env_file:
      - .env

    depends_on:
      - db

  db:
    image: postgres:17

    environment:
      POSTGRES_DB: university_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgre212223

    ports:
      - "5432:5432"

  redis:
    image: redis:8

    ports:
      - "6379:6379"

      

